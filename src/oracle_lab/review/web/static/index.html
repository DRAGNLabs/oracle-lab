<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Oracle Lab review</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/static/vendor/github.min.css" media="(prefers-color-scheme: light)">
  <link rel="stylesheet" href="/static/vendor/github-dark.min.css" media="(prefers-color-scheme: dark)">
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/vendor/highlight.min.js"></script>
  <script src="/static/vendor/marked.min.js"></script>
  <script src="/static/app.js" type="module"></script>
</head>
<body>
  <header class="topbar">
    <a class="home" href="#/">Oracle Lab review</a>
    <span class="spacer"></span>
    <span class="rater" id="rater"></span>
    <button type="button" class="help-button" id="help-button" aria-haspopup="dialog">How to review</button>
  </header>

  <main id="app" aria-live="polite"></main>

  <dialog id="help" aria-label="How to review">
    <article class="prose" id="help-body"></article>
    <form method="dialog"><button class="primary" autofocus>Start reviewing</button></form>
  </dialog>

  <div id="tooltip" role="tooltip" hidden></div>

  <dialog id="finder" aria-label="Find a file">
    <input type="search" id="finder-input" placeholder="Type part of a file path" autocomplete="off" spellcheck="false">
    <ul id="finder-results" role="listbox"></ul>
  </dialog>
</body>
</html>
