# The 50-problem study set: 25 SWE-bench Verified, 25 SWE-rebench V2.
# Problems the classifier rejected are recorded in study-selection.json. Their
# replacements were drawn at random (seed 2197373611748016610) from every problem the
# pipeline can run, in the order the draw produced.
# Set them up with:
#   uv run oracle-lab setup configs/problems/study.yaml
