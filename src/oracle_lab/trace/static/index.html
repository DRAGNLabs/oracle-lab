<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Oracle Lab traces</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/vendor/github.min.css" media="(prefers-color-scheme: light)">
  <link rel="stylesheet" href="/vendor/github-dark.min.css" media="(prefers-color-scheme: dark)">
  <link rel="stylesheet" href="/static/app.css">
  <script src="/vendor/highlight.min.js"></script>
  <script src="/vendor/marked.min.js"></script>
  <script src="/static/app.js" type="module"></script>
</head>
<body>
  <header class="topbar">
    <b>Oracle Lab traces</b>
    <select id="run-picker" aria-label="Run"></select>
    <span class="spacer"></span>
    <label><input type="checkbox" id="lanes-by-file"> Lanes by file</label>
  </header>
  <main class="layout">
    <div id="timeline"></div>
    <aside class="panel">
      <nav class="tabs">
        <span class="tab-group">Run</span>
        <button type="button" data-panel="summary">Summary</button>
        <button type="button" data-panel="tests">Test files</button>
        <button type="button" data-panel="legend">Legend</button>
        <span class="tab-group">Step</span>
        <button type="button" data-panel="event">Event</button>
      </nav>
      <div id="panel-body"></div>
    </aside>
  </main>
  <div id="tooltip" role="tooltip" hidden></div>
</body>
</html>
