[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oracle-lab"
version = "0.1.0"
description = "Paired-version evaluation of agent-generated unit tests"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6,<7",
    "docker>=7.1,<8",
    "pydantic>=2.10,<3",
    "python-dotenv>=1,<2",
]

[project.optional-dependencies]
dataset = ["datasets>=3,<4"]
dev = ["pytest>=8,<9", "ruff>=0.11,<1"]
analysis = ["matplotlib>=3.8,<4", "ipykernel>=6,<7"]

[project.scripts]
oracle-lab = "oracle_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
oracle_lab = [
    "container/helpers/*.py",
    "container/docker/*.Dockerfile",
    "container/docker/package*.json",
    "container/docker/*.md",
    "judge/templates/*.md",
    "judge/templates/*.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["docker: requires a working Docker daemon and downloaded images"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
